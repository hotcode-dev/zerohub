asyncapi: 3.1.0
id: urn:zerohub:server:v1
info:
  title: ZeroHub Server Signaling API
  version: 1.0.0
  description: |
    AsyncAPI specification for ZeroHub v1 signaling over WebSocket.

    Notes:
    - All signaling messages are sent as binary protobuf payloads.
    - Protobuf sources:
      - proto/zerohub/v1/client_message.proto
      - proto/zerohub/v1/server_message.proto
    - Channel address determines hub behavior (create/join/join-or-create).
    - The admin endpoint `/v1/permanent-hubs/create` (channel
      `permanentHubsCreate`) is plain HTTP, not WebSocket: it uses the
      `admin-local`/`admin-production` servers declared on that channel.
    - The hub-metadata read endpoints `/v1/hubs/get` (channel `hubsGet`)
      and `/v1/random-hubs/get` (channel `randomHubsGet`) are likewise
      plain HTTP (GET, JSON response, no request payload), not WebSocket
      signaling channels, and use the same `admin-local`/`admin-production`
      servers.

defaultContentType: application/protobuf

servers:
  local:
    host: localhost:{port}
    pathname: /
    protocol: ws
    description: Local development server
    variables:
      port:
        default: '8080'
  production:
    host: '{host}'
    pathname: /
    protocol: wss
    description: Production server
    variables:
      host:
        default: api.example.com
  # Plain-HTTP admin API. The server serves /v1/permanent-hubs/create over
  # the same host/port as the WebSocket endpoints, but that endpoint never
  # upgrades, so it is scoped to these HTTP servers instead of the ws ones.
  admin-local:
    host: localhost:{port}
    pathname: /v1
    protocol: http
    description: Local development server (plain-HTTP admin endpoints)
    variables:
      port:
        default: '8080'
  admin-production:
    host: '{host}'
    pathname: /v1
    protocol: https
    description: Production server (plain-HTTP admin endpoints)
    variables:
      host:
        default: api.example.com

channels:
  hubsCreate:
    address: /v1/hubs/create
    description: |
      Create a static hub and connect to it.
      Query params:
      - id (required): hub id
      - peerMetadata (optional): stringified peer metadata
      - hubMetadata (optional): stringified hub metadata

      Hub ids are not globally unique across modes: each hub type (static,
      random, IP, permanent) keeps its own storage. If a hub with the same
      id already exists in the permanent or random namespace on this
      server, this endpoint answers 409 Conflict with the body
      `{"error": "hub id collides with another hub type"}` instead of
      creating a shadow hub under the same id.
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  hubsJoin:
    address: /v1/hubs/join
    description: |
      Join an existing static hub.
      Query params:
      - id (required): hub id
      - peerMetadata (optional): stringified peer metadata
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  hubsJoinOrCreate:
    address: /v1/hubs/join-or-create
    description: |
      Join a static hub or create it if it does not exist.
      Query params:
      - id (required): hub id
      - peerMetadata (optional): stringified peer metadata
      - hubMetadata (optional): stringified hub metadata (used only on create)

      If the id is already held by the permanent or random namespace,
      this endpoint answers 409 Conflict with the body
      `{"error": "hub id collides with another hub type"}` instead of
      creating a parallel static hub under the same id — joining a
      permanent hub with the same id reaches that hub, so a shadow static
      hub would fragment the room under one public id.
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  hubsGet:
    address: /v1/hubs/get
    description: |
      Get the metadata of an existing static hub.

      Unlike the other /v1/hubs/* endpoints, this is a plain HTTP GET read
      endpoint, NOT a WebSocket signaling channel: it never upgrades the
      connection, carries no request payload (the hub id rides on the URL),
      and answers a single JSON object describing the hub — `{id, createdAt,
      metadata, isPermanent}`. It is unreachable from the SDK (the SDK only
      dials WebSocket signaling endpoints) and is instead consumed
      out-of-band with an HTTP client (curl, fetch from a Node.js process),
      exactly like `/v1/permanent-hubs/create`.

      Query params:
      - id (required): hub id

      Response: HTTP 200 with the `Hub` JSON body. Error responses are 400
      (missing/empty `id`, body `{"error": "id query parameter is
      required"}`), 413 (`id` exceeds the 4096-byte cap, body
      `{"error": "id query parameter exceeds the maximum size of 4096
      bytes"}`) and 404 (no hub with that id, body
      `{"error": "hub not found"}`).
    servers:
      - $ref: '#/servers/admin-local'
      - $ref: '#/servers/admin-production'
    messages:
      getHubRequest:
        $ref: '#/components/messages/HubGetRequest'
      hub:
        $ref: '#/components/messages/HubInfo'
    bindings:
      http: {}

  randomHubsCreate:
    address: /v1/random-hubs/create
    description: |
      Create a hub with a random id and connect.
      Query params:
      - peerMetadata (optional): stringified peer metadata
      - hubMetadata (optional): stringified hub metadata
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  randomHubsJoin:
    address: /v1/random-hubs/join
    description: |
      Join an existing random hub.
      Query params:
      - id (required): hub id
      - peerMetadata (optional): stringified peer metadata
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  randomHubsGet:
    address: /v1/random-hubs/get
    description: |
      Get the metadata of an existing random hub.

      Like `/v1/hubs/get`, this is a plain HTTP GET read endpoint, NOT a
      WebSocket signaling channel: it never upgrades the connection, carries
      no request payload (the hub id rides on the URL), and answers a single
      JSON object describing the hub — `{id, createdAt, metadata,
      isPermanent}`. It is unreachable from the SDK and is instead consumed
      out-of-band with an HTTP client (curl, fetch from a Node.js process).

      Query params:
      - id (required): hub id

      Response: HTTP 200 with the `Hub` JSON body. Error responses are 400
      (missing/empty `id`, body `{"error": "id query parameter is
      required"}`), 413 (`id` exceeds the 4096-byte cap, body
      `{"error": "id query parameter exceeds the maximum size of 4096
      bytes"}`) and 404 (no hub with that id, body
      `{"error": "hub not found"}`).
    servers:
      - $ref: '#/servers/admin-local'
      - $ref: '#/servers/admin-production'
    messages:
      getHubRequest:
        $ref: '#/components/messages/HubGetRequest'
      hub:
        $ref: '#/components/messages/HubInfo'
    bindings:
      http: {}

  ipHubsJoinOrCreate:
    address: /v1/ip-hubs/join-or-create
    description: |
      Join or create a hub keyed by a hash of the remote IP.
      Query params:
      - peerMetadata (optional): stringified peer metadata
      - hubMetadata (optional): stringified hub metadata (used only on create)
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  permanentHubsJoin:
    address: /v1/permanent-hubs/join
    description: |
      Join an existing permanent hub.
      Query params:
      - id (required): hub id
      - peerMetadata (optional): stringified peer metadata
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      serverMessage:
        $ref: '#/components/messages/ServerMessage'
    bindings:
      ws:
        method: GET

  permanentHubsCreate:
    address: /v1/permanent-hubs/create
    description: |
      Create a permanent (never-expires) hub.

      Unlike every other create/join endpoint, this is a plain HTTP admin
      endpoint, NOT a WebSocket signaling channel. It requires the
      `Authorization` header (the base64 encoding of the server's
      APP_CLIENT_SECRET) and returns a single JSON object describing the
      created hub (HTTP 200) — it does not upgrade to WebSocket and adds
      no peer.

      Because a browser `WebSocket` handshake cannot carry custom headers,
      this endpoint is unreachable from the SDK and is instead called
      out-of-band with an HTTP client (curl, fetch from a Node.js
      process) that can set the `Authorization` header. After creating a
      hub this way, clients connect to it with `/v1/permanent-hubs/join`.

      Query params:
      - id (required): hub id
      - hubMetadata (optional): stringified hub metadata

      Hub ids are not globally unique across modes: each hub type (static,
      random, IP, permanent) keeps its own storage. If a hub with the same
      id already exists in the static or random namespace on this server,
      this endpoint returns 409 Conflict with the body
      `{"error": "hub id collides with another hub type"}` instead of
      creating a shadow hub under the same id.

      Response: HTTP 200 with the `PermanentHubCreated` JSON body; error
      responses are 401 (missing/invalid Authorization header, body
      `{"error": "invalid authorization code"}`), 400 (empty `id` or
      malformed `hubMetadata` JSON, body `{"error": ...}`), 409
      (duplicate or cross-mode colliding hub id, body `{"error": ...}`)
      and 500 (internal error, body `{"error": "create hub error"}`).
      While the server is migrating it returns 301 with body
      `{"status": "migrating", "backupHost": "..."}`.
    servers:
      - $ref: '#/servers/admin-local'
      - $ref: '#/servers/admin-production'
    messages:
      createRequest:
        $ref: '#/components/messages/PermanentHubCreateRequest'
      createdHub:
        $ref: '#/components/messages/PermanentHubCreated'
      createError:
        $ref: '#/components/messages/PermanentHubCreateError'
    bindings:
      http: {}

operations:
  clientSendOnHubsCreate:
    action: send
    channel:
      $ref: '#/channels/hubsCreate'
    messages:
      - $ref: '#/channels/hubsCreate/messages/clientMessage'

  clientReceiveOnHubsCreate:
    action: receive
    channel:
      $ref: '#/channels/hubsCreate'
    messages:
      - $ref: '#/channels/hubsCreate/messages/serverMessage'

  clientSendOnHubsJoin:
    action: send
    channel:
      $ref: '#/channels/hubsJoin'
    messages:
      - $ref: '#/channels/hubsJoin/messages/clientMessage'

  clientReceiveOnHubsJoin:
    action: receive
    channel:
      $ref: '#/channels/hubsJoin'
    messages:
      - $ref: '#/channels/hubsJoin/messages/serverMessage'

  # Plain-HTTP read endpoint (not a WebSocket channel): an HTTP client
  # issues a GET (the query param `id` rides on the URL; there is no
  # request body) and receives a single JSON `hub` response. The GET
  # method is fixed by the server routing (fasthttp: `GET /v1/hubs/get`).
  adminSendOnHubsGet:
    action: send
    channel:
      $ref: '#/channels/hubsGet'
    messages:
      - $ref: '#/channels/hubsGet/messages/getHubRequest'

  adminReceiveOnHubsGet:
    action: receive
    channel:
      $ref: '#/channels/hubsGet'
    messages:
      - $ref: '#/channels/hubsGet/messages/hub'

  clientSendOnHubsJoinOrCreate:
    action: send
    channel:
      $ref: '#/channels/hubsJoinOrCreate'
    messages:
      - $ref: '#/channels/hubsJoinOrCreate/messages/clientMessage'

  clientReceiveOnHubsJoinOrCreate:
    action: receive
    channel:
      $ref: '#/channels/hubsJoinOrCreate'
    messages:
      - $ref: '#/channels/hubsJoinOrCreate/messages/serverMessage'

  clientSendOnRandomHubsCreate:
    action: send
    channel:
      $ref: '#/channels/randomHubsCreate'
    messages:
      - $ref: '#/channels/randomHubsCreate/messages/clientMessage'

  clientReceiveOnRandomHubsCreate:
    action: receive
    channel:
      $ref: '#/channels/randomHubsCreate'
    messages:
      - $ref: '#/channels/randomHubsCreate/messages/serverMessage'

  clientSendOnRandomHubsJoin:
    action: send
    channel:
      $ref: '#/channels/randomHubsJoin'
    messages:
      - $ref: '#/channels/randomHubsJoin/messages/clientMessage'

  clientReceiveOnRandomHubsJoin:
    action: receive
    channel:
      $ref: '#/channels/randomHubsJoin'
    messages:
      - $ref: '#/channels/randomHubsJoin/messages/serverMessage'

  # Plain-HTTP read endpoint (not a WebSocket channel): same modeling as
  # `/v1/hubs/get` — a GET with no request body, a single JSON `hub`
  # response. The GET method is fixed by the server routing (fasthttp:
  # `GET /v1/random-hubs/get`).
  adminSendOnRandomHubsGet:
    action: send
    channel:
      $ref: '#/channels/randomHubsGet'
    messages:
      - $ref: '#/channels/randomHubsGet/messages/getHubRequest'

  adminReceiveOnRandomHubsGet:
    action: receive
    channel:
      $ref: '#/channels/randomHubsGet'
    messages:
      - $ref: '#/channels/randomHubsGet/messages/hub'

  # Plain-HTTP admin endpoint (not a WebSocket channel): the admin tool
  # issues the request (the query params `id`/`hubMetadata` and the
  # `Authorization` header are carried by the HTTP request itself) and
  # receives a single JSON `createdHub` response. The GET method is fixed
  # by the server routing (fasthttp: `GET /v1/permanent-hubs/create`).
  adminSendOnPermanentHubsCreate:
    action: send
    channel:
      $ref: '#/channels/permanentHubsCreate'
    messages:
      - $ref: '#/channels/permanentHubsCreate/messages/createRequest'

  adminReceiveOnPermanentHubsCreate:
    action: receive
    channel:
      $ref: '#/channels/permanentHubsCreate'
    messages:
      - $ref: '#/channels/permanentHubsCreate/messages/createdHub'
      - $ref: '#/channels/permanentHubsCreate/messages/createError'
    # AsyncAPI 3.1.0 has no `errors` keyword on operations; this extension
    # surfaces the documented HTTP error responses on the receive operation
    # for tooling that renders operations. The payload of every body is the
    # `PermanentHubCreateError` schema, carried on the channel's
    # `createError` message; the 301 migrating response is the only status
    # whose body differs ({"status": "migrating", "backupHost": "..."}) and
    # is described on the channel.
    x-asyncapi-errors:
      - status: 400
        message: '#/channels/permanentHubsCreate/messages/createError'
      - status: 401
        message: '#/channels/permanentHubsCreate/messages/createError'
      - status: 409
        message: '#/channels/permanentHubsCreate/messages/createError'
      - status: 413
        message: '#/channels/permanentHubsCreate/messages/createError'
      - status: 500
        message: '#/channels/permanentHubsCreate/messages/createError'

  clientSendOnIpHubsJoinOrCreate:
    action: send
    channel:
      $ref: '#/channels/ipHubsJoinOrCreate'
    messages:
      - $ref: '#/channels/ipHubsJoinOrCreate/messages/clientMessage'

  clientReceiveOnIpHubsJoinOrCreate:
    action: receive
    channel:
      $ref: '#/channels/ipHubsJoinOrCreate'
    messages:
      - $ref: '#/channels/ipHubsJoinOrCreate/messages/serverMessage'

  clientSendOnPermanentHubsJoin:
    action: send
    channel:
      $ref: '#/channels/permanentHubsJoin'
    messages:
      - $ref: '#/channels/permanentHubsJoin/messages/clientMessage'

  clientReceiveOnPermanentHubsJoin:
    action: receive
    channel:
      $ref: '#/channels/permanentHubsJoin'
    messages:
      - $ref: '#/channels/permanentHubsJoin/messages/serverMessage'

components:
  messages:
    ClientMessage:
      name: ClientMessage
      title: Client signaling message
      summary: Protobuf oneof wrapper for client-to-server signaling messages
      contentType: application/protobuf
      payload:
        oneOf:
          - $ref: '#/components/schemas/ClientSendOfferVariant'
          - $ref: '#/components/schemas/ClientSendAnswerVariant'
          - $ref: '#/components/schemas/ClientSendIceCandidateVariant'
      x-protobuf-message: proto.zerohub.v1.ClientMessage

    ServerMessage:
      name: ServerMessage
      title: Server signaling message
      summary: Protobuf oneof wrapper for server-to-client signaling messages
      contentType: application/protobuf
      payload:
        oneOf:
          - $ref: '#/components/schemas/ServerHubInfoVariant'
          - $ref: '#/components/schemas/ServerPeerJoinedVariant'
          - $ref: '#/components/schemas/ServerPeerDisconnectedVariant'
          - $ref: '#/components/schemas/ServerOfferVariant'
          - $ref: '#/components/schemas/ServerAnswerVariant'
          - $ref: '#/components/schemas/ServerIceCandidateVariant'
      x-protobuf-message: proto.zerohub.v1.ServerMessage

    PermanentHubCreateRequest:
      name: PermanentHubCreateRequest
      title: Permanent hub creation request
      summary: HTTP GET request to the admin-gated permanent-hub create endpoint
      description: |
        Carried by `GET /v1/permanent-hubs/create` on the plain-HTTP admin
        server. The payload is empty: the request is entirely described by
        its URL and headers.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/PermanentHubCreateRequestHeaders'
      payload:
        type: 'null'

    PermanentHubCreated:
      name: PermanentHubCreated
      title: Permanent hub creation response
      summary: JSON body returned by the admin-gated permanent-hub create endpoint
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PermanentHubCreated'

    PermanentHubCreateError:
      name: PermanentHubCreateError
      title: Permanent hub creation error response
      summary: JSON error body returned by the admin-gated permanent-hub create endpoint
      description: >
        Carried on the HTTP 400/401/409/413/500 responses of
        `GET /v1/permanent-hubs/create`. The 401 answer wins over any 400
        validation answer (auth runs first), and while the server is
        migrating the 301 answer — with the distinct
        `{"status": "migrating", "backupHost": "..."}` body described on
        the channel — replaces every other response.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PermanentHubCreateError'

    HubGetRequest:
      name: HubGetRequest
      title: Hub metadata read request
      summary: HTTP GET request to /v1/hubs/get or /v1/random-hubs/get
      description: |
        Carried by `GET /v1/hubs/get` (static hubs) or `GET
        /v1/random-hubs/get` (random hubs) on the plain-HTTP servers. The
        payload is empty: the request is entirely described by the `id`
        query parameter on the URL.
      contentType: application/json
      payload:
        type: 'null'

    HubInfo:
      name: HubInfo
      title: Hub metadata response
      summary: JSON body returned by /v1/hubs/get and /v1/random-hubs/get
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Hub'

  schemas:
    PermanentHubCreateRequestHeaders:
      type: object
      required: [Authorization]
      description: >
        Headers of the GET request to /v1/permanent-hubs/create. The query
        parameters `id` (required, hub id) and `hubMetadata` (optional,
        stringified hub metadata) ride on the URL and are documented on
        the channel.
      properties:
        Authorization:
          type: string
          description: >
            Base64 (StdEncoding) of the server's APP_CLIENT_SECRET;
            requests without a valid header get 401.
      additionalProperties: false

    PermanentHubCreateError:
      type: object
      required: [error]
      description: >
        JSON body of the error responses (400/401/409/413/500) returned by
        /v1/permanent-hubs/create.
      properties:
        error:
          type: string
          description: |
            One of, depending on the status code:
            - 401: "invalid authorization code"
            - 400: "id query parameter is required" or
              "invalid hubMetadata query parameter: must be JSON"
            - 409: "hub id already exists" or
              "hub id collides with another hub type"
            - 413: "id query parameter exceeds the maximum size of 4096 bytes"
              or "hubMetadata query parameter exceeds the maximum size of
              4096 bytes"
            - 500: "create hub error"
      additionalProperties: false

    PermanentHubCreated:
      type: object
      required: [id, createdAt, metadata, isPermanent]
      description: JSON body of the /v1/permanent-hubs/create response (the created hub).
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: string
        isPermanent:
          type: boolean

    HubGetError:
      type: object
      required: [error]
      description: >
        JSON body of the error responses (400/404/413) returned by
        /v1/hubs/get and /v1/random-hubs/get.
      properties:
        error:
          type: string
          description: |
            One of, depending on the status code:
            - 400: "id query parameter is required"
            - 413: "id query parameter exceeds the maximum size of 4096 bytes"
            - 404: "hub not found"
      additionalProperties: false

    Hub:
      type: object
      required: [id, createdAt, metadata, isPermanent]
      description: >
        JSON body of the /v1/hubs/get and /v1/random-hubs/get response: the
        looked-up hub. The peer roster is intentionally not included — the
        read endpoint answers hub-level metadata only.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: string
        isPermanent:
          type: boolean

    ClientSendOfferVariant:
      type: object
      required: [send_offer_message]
      properties:
        send_offer_message:
          $ref: '#/components/schemas/SendOfferMessage'
      additionalProperties: false

    ClientSendAnswerVariant:
      type: object
      required: [send_answer_message]
      properties:
        send_answer_message:
          $ref: '#/components/schemas/SendAnswerMessage'
      additionalProperties: false

    ClientSendIceCandidateVariant:
      type: object
      required: [send_ice_candidate_message]
      properties:
        send_ice_candidate_message:
          $ref: '#/components/schemas/SendIceCandidateMessage'
      additionalProperties: false

    SendOfferMessage:
      type: object
      required: [answer_peer_id, offer_sdp]
      properties:
        answer_peer_id:
          type: string
        offer_sdp:
          type: string
      additionalProperties: false

    SendAnswerMessage:
      type: object
      required: [offer_peer_id, answer_sdp]
      properties:
        offer_peer_id:
          type: string
        answer_sdp:
          type: string
      additionalProperties: false

    SendIceCandidateMessage:
      type: object
      required: [peer_id, candidate]
      properties:
        peer_id:
          type: string
        candidate:
          type: string
      additionalProperties: false

    ServerHubInfoVariant:
      type: object
      required: [hub_info_message]
      properties:
        hub_info_message:
          $ref: '#/components/schemas/HubInfoMessage'
      additionalProperties: false

    ServerPeerJoinedVariant:
      type: object
      required: [peer_joined_message]
      properties:
        peer_joined_message:
          $ref: '#/components/schemas/PeerJoinedMessage'
      additionalProperties: false

    ServerPeerDisconnectedVariant:
      type: object
      required: [peer_disconnected_message]
      properties:
        peer_disconnected_message:
          $ref: '#/components/schemas/PeerDisconnectedMessage'
      additionalProperties: false

    ServerOfferVariant:
      type: object
      required: [offer_message]
      properties:
        offer_message:
          $ref: '#/components/schemas/OfferMessage'
      additionalProperties: false

    ServerAnswerVariant:
      type: object
      required: [answer_message]
      properties:
        answer_message:
          $ref: '#/components/schemas/AnswerMessage'
      additionalProperties: false

    ServerIceCandidateVariant:
      type: object
      required: [ice_candidate_message]
      properties:
        ice_candidate_message:
          $ref: '#/components/schemas/IceCandidateMessage'
      additionalProperties: false

    Peer:
      type: object
      required: [id, metadata, join_time]
      properties:
        id:
          type: string
        metadata:
          type: string
        join_time:
          type: string
          format: date-time
          description: RFC3339 representation of protobuf Timestamp
      additionalProperties: false

    HubInfoMessage:
      type: object
      required: [id, create_time, my_peer_id, hub_metadata, peers]
      properties:
        id:
          type: string
        create_time:
          type: string
          format: date-time
          description: RFC3339 representation of protobuf Timestamp
        my_peer_id:
          type: string
        hub_metadata:
          type: string
        peers:
          type: array
          items:
            $ref: '#/components/schemas/Peer'
      additionalProperties: false

    PeerJoinedMessage:
      type: object
      required: [peer]
      properties:
        peer:
          $ref: '#/components/schemas/Peer'
      additionalProperties: false

    PeerDisconnectedMessage:
      type: object
      required: [peer_id]
      properties:
        peer_id:
          type: string
      additionalProperties: false

    OfferMessage:
      type: object
      required: [offer_peer_id, offer_sdp]
      properties:
        offer_peer_id:
          type: string
        offer_sdp:
          type: string
      additionalProperties: false

    AnswerMessage:
      type: object
      required: [answer_peer_id, answer_sdp]
      properties:
        answer_peer_id:
          type: string
